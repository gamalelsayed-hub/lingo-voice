name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The run number is the build number, so the app can tell that a
      # newer APK exists.
      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Write version.json
        run: |
          sha=$(sha256sum build/app/outputs/flutter-apk/app-release.apk | cut -d' ' -f1)
          echo "{\"build\": ${{ github.run_number }}, \"sha256\": \"$sha\"}" > build/app/outputs/flutter-apk/version.json
          cat build/app/outputs/flutter-apk/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: lingo-voice-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # A fixed "latest" release gives a direct download link for the phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: أحدث نسخة
          body: "نسخة مبنية تلقائياً من آخر تعديل (${{ github.sha }})."
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/version.json
